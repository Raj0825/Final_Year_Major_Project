spring:
  application:
    name: freshrescue-backend
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:${MONGODB_URI:mongodb://localhost:27017/freshrescue}}
      auto-index-creation: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:8080}

# Python FastAPI service exposing the CNN + OCR /predict endpoint
ml:
  service:
    base-url: ${ML_SERVICE_URL:http://localhost:8000}
    predict-path: /predict

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration-ms: 86400000 # 24h

# Discount tier thresholds, kept configurable rather than hardcoded in the service
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

freshness:
  tiers:
    tier1-max: 0.70
    tier2-max: 0.50
    tier3-max: 0.30
    expired-max: 0.10
  discount:
    tier1-percent: 20
    tier2-percent: 40
    tier3-percent: 60
  reservation-hold-minutes: 15